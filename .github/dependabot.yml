version: 2
updates:
  # Dev tooling only (phpunit, phpstan, phpcs) — the app itself has zero
  # runtime dependencies, so this just keeps the test/lint toolchain current.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keeps actions/checkout, shivammathur/setup-php, etc. pinned to current
  # commit SHAs (see ci.yml/release.yml) rather than drifting unnoticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
