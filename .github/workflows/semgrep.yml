name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Static security analysis
    runs-on: ubuntu-latest
    # Pinned by digest rather than tag (semgrep/semgrep:latest as of 2026-09-10),
    # for the same supply-chain reason the Actions below are pinned by SHA.
    container:
      image: semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan (security-audit + php rulesets)
        run: semgrep scan --config p/security-audit --config p/php --error
