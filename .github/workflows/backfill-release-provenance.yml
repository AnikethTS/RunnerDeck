name: Backfill release provenance

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to backfill (e.g. v1.0.0 v1.1.0)"
        required: true
        default: "v1.0.0 v1.1.0 v1.2.0"

permissions:
  contents: read

jobs:
  backfill:
    name: Attest existing releases and attach signature bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download each release's zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          read -r -a tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do
            gh release download "$tag" --repo "$REPO" --pattern '*.zip' --dir artifacts --clobber
          done

      - name: Attest build provenance for all downloaded zips
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/*.zip"

      - name: Attach the attestation bundle to each release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
          REPO: ${{ github.repository }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          read -r -a tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do
            bundle="runnerdeck-${tag}.zip.sigstore.json"
            cp "$ATTESTATION_BUNDLE" "$bundle"
            gh release upload "$tag" "$bundle" --repo "$REPO" --clobber
          done
