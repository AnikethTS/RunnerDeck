name: Scorecard analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Branch-Protection is scored from repository rulesets (readable with
      # GITHUB_TOKEN). Do not add classic branch protection: the default
      # Actions token cannot read those rules and Scorecard reports an
      # internal error. A SCORECARD_TOKEN with Administration:read is the
      # other option; rulesets avoid storing a PAT.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
