name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-static-analysis:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: composer audit (known CVEs in dependencies)
        run: composer audit

      - name: PHP syntax check
        run: |
          find src public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: phpcs (PSR-12)
        run: composer run cs

      - name: phpstan
        run: composer run stan

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: eslint
        run: npm run lint:js

      - name: stylelint
        run: npm run lint:css

  test:
    name: Unit tests (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: "8.1" }
          - { os: ubuntu-latest, php: "8.3" }
          - { os: macos-latest, php: "8.1" }
          - { os: macos-latest, php: "8.3" }
          - { os: ubuntu-22.04, php: "8.3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: composer run test

  smoke-test:
    name: Boot smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json, pdo_sqlite
          coverage: none

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8090/api.php?action=status" -o response.json; then
              break
            fi
            sleep 0.5
          done
          kill "$SERVER_PID" 2>/dev/null || true

          echo "--- response ---"
          cat response.json
          echo

          php -r '
            $data = json_decode(file_get_contents("response.json"), true);
            if (!is_array($data) || !array_key_exists("health", $data) || !array_key_exists("runners", $data)) {
              fwrite(STDERR, "unexpected response shape\n");
              exit(1);
            }
            echo "smoke test OK\n";
          '

  e2e-test:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  alpine-smoke-test:
    name: Boot smoke test (Alpine/musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: php:8.3-cli-alpine
    steps:
      - name: Install git, bash, curl, and required PHP extensions
        run: |
          apk add --no-cache git bash curl sqlite-dev
          apk add --no-cache --virtual .build-deps $PHPIZE_DEPS
          docker-php-ext-install pcntl posix pdo_sqlite
          apk del .build-deps

      - name: Install gh CLI (the base image has none; RunnerDeck shells out to it)
        run: |
          GH_VERSION=2.100.0
          GH_SHA256=e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8090/api.php?action=status" -o response.json; then
              break
            fi
            sleep 0.5
          done
          kill "$SERVER_PID" 2>/dev/null || true

          echo "--- response ---"
          cat response.json
          echo

          php -r '
            $data = json_decode(file_get_contents("response.json"), true);
            if (!is_array($data) || !array_key_exists("health", $data) || !array_key_exists("runners", $data)) {
              fwrite(STDERR, "unexpected response shape\n");
              exit(1);
            }
            echo "smoke test OK\n";
          '

  docker-smoke-test:
    name: Boot smoke test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          coverage: none

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: runnerdeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container and hit the status endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run -d --name runnerdeck-ci \
            -p 127.0.0.1:8090:8090 \
            -e RUNNERDECK_ORG=smoke-test-org \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            runnerdeck:ci

          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8090/api.php?action=status" -o response.json; then
              break
            fi
            sleep 0.5
          done
          docker logs runnerdeck-ci
          docker rm -f runnerdeck-ci >/dev/null

          echo "--- response ---"
          cat response.json
          echo

          php -r '
            $data = json_decode(file_get_contents("response.json"), true);
            if (!is_array($data) || !array_key_exists("health", $data) || !array_key_exists("runners", $data)) {
              fwrite(STDERR, "unexpected response shape\n");
              exit(1);
            }
            echo "smoke test OK\n";
          '
