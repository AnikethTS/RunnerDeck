name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  plan:
    name: CI · Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.plan.outputs.fast }}
      unit: ${{ steps.plan.outputs.unit }}
      quality: ${{ steps.plan.outputs.quality }}
      smoke: ${{ steps.plan.outputs.smoke }}
      e2e: ${{ steps.plan.outputs.e2e }}
      live: ${{ steps.plan.outputs.live }}
      live_extended: ${{ steps.plan.outputs.live_extended }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          has() { echo "$LABELS" | jq -e --arg l "$1" 'index($l) != null' >/dev/null 2>&1; }
          everything=false
          if [ "$EVENT" != "pull_request" ]; then everything=true; fi
          full=false
          if has ci:full; then full=true; fi
          pick() {
            if [ "$everything" = true ] || [ "$full" = true ] || has "ci:$1"; then echo true; else echo false; fi
          }
          {
            echo "fast=true"
            echo "unit=$(pick unit)"
            echo "quality=$(pick quality)"
            echo "smoke=$(pick smoke)"
            echo "e2e=$(pick e2e)"
            echo "live=$(pick live)"
            echo "package=$(pick package)"
            if [ "$everything" = true ] || has ci:live-extended; then echo "live_extended=true"; else echo "live_extended=false"; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint-php:
    name: Lint · PHP
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3.36"
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        working-directory: app
        run: composer validate --strict

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress

      - name: composer audit (known CVEs in dependencies)
        working-directory: app
        run: composer audit

      - name: PHP syntax check
        working-directory: app
        run: |
          find src public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: phpcs (PSR-12)
        working-directory: app
        run: composer run cs

      - name: phpstan
        working-directory: app
        run: composer run stan

  lint-js:
    name: Lint · JavaScript and CSS
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: npm audit (known CVEs in dependencies)
        run: node tools/ci/npm-audit.mjs

      - name: eslint
        run: npm run lint:js

      - name: stylelint
        run: npm run lint:css

  actionlint:
    name: Lint · GitHub Actions
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflow YAML
        run: actionlint -color

  shellcheck:
    name: Lint · Shell scripts
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo mv /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          shellcheck -x -S warning run.sh bin/*.sh app/bin/*.sh tools/ci/*.sh

  gitleaks:
    name: Security · Secret scan
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  test:
    name: Unit · ${{ matrix.platform }} · PHP ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: "Ubuntu latest", php: "8.1", label: "8.1" }
          - { os: ubuntu-latest, platform: "Ubuntu latest", php: "8.2", label: "8.2" }
          - { os: ubuntu-latest, platform: "Ubuntu latest", php: "8.3", label: "8.3" }
          - { os: ubuntu-latest, platform: "Ubuntu latest", php: "8.4", label: "8.4" }
          - { os: ubuntu-latest, platform: "Ubuntu latest", php: "8.5.12", label: "8.5" }
          - { os: macos-latest, platform: "macOS latest", php: "8.5.12", label: "8.5" }
          - { os: ubuntu-22.04, platform: "Ubuntu 22.04", php: "8.1", label: "8.1" }
          - { os: ubuntu-22.04, platform: "Ubuntu 22.04", php: "8.3.36", label: "8.3" }
          - { os: ubuntu-22.04, platform: "Ubuntu 22.04", php: "8.5.12", label: "8.5" }
          - { os: ubuntu-22.04-arm, platform: "Ubuntu 22.04 ARM", php: "8.1", label: "8.1" }
          - { os: macos-15, platform: "macOS 15", php: "8.1", label: "8.1" }
          - { os: macos-15, platform: "macOS 15", php: "8.5.12", label: "8.5" }
          - { os: macos-15-intel, platform: "macOS 15 Intel", php: "8.5.12", label: "8.5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        working-directory: app
        run: composer run test

  coverage:
    name: Quality · Coverage gate
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5.12"
          extensions: posix, pcntl, json, pdo_sqlite, pcov
          tools: composer:v2
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress

      - name: Run test suite with coverage
        working-directory: app
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Enforce minimum line coverage
        run: php tools/ci/coverage-gate.php app/coverage.xml 75

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: app/coverage.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: app/coverage.xml
          retention-days: 7

  random-order:
    name: Quality · Random-order tests
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5.12"
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress

      - name: Run test suite in random order
        working-directory: app
        run: |
          for seed in 1 2 3; do
            vendor/bin/phpunit --order-by=random --random-order-seed="$seed"
          done

  windows-test:
    name: Unit · ${{ matrix.platform }} · PHP ${{ matrix.label }} (Windows subset)
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "Windows latest", php: "8.5.12", label: "8.5" }
          - { os: windows-2022, platform: "Windows 2022", php: "8.1", label: "8.1" }
          - { os: windows-2022, platform: "Windows 2022", php: "8.5.12", label: "8.5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-posix --ignore-platform-req=ext-pcntl

      - name: Windows unit tests
        working-directory: app
        run: vendor/bin/phpunit tests/WindowsSupportTest.php

      - name: Real process control smoke (PowerShell, CIM, taskkill)
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "runnerdeck-smoke"
          New-Item -ItemType Directory -Path $scratch | Out-Null
          php tools/ci/windows-smoke.php $scratch

  e2e-real-runner:
    name: E2E · Real runner · ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.live == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: "Ubuntu latest" }
          - { os: macos-latest, platform: "macOS latest" }
          - { os: windows-latest, platform: "Windows latest" }
    env:
      GH_TOKEN: ${{ secrets.E2E_RUNNER_TOKEN }}
      E2E_REPO: ${{ vars.E2E_REPO }}
      E2E_TAG: rd-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check end-to-end configuration
        id: gate
        shell: bash
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$E2E_REPO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::E2E_RUNNER_TOKEN secret and E2E_REPO variable must be set"
            exit 1
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          php-version: "8.5.12"
          extensions: json, pdo_sqlite
          coverage: none

      - name: Register a real runner, run a job on it, and clean up
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: ./tools/ci/e2e-real-runner.sh

      - name: Remove leftover runners and runs
        if: always() && steps.gate.outputs.enabled == 'true'
        shell: bash
        run: ./tools/ci/e2e-real-runner.sh cleanup

  e2e-live:
    name: E2E · Live dashboard · ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.live == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: "Ubuntu latest" }
          - { os: macos-latest, platform: "macOS latest" }
          - { os: windows-latest, platform: "Windows latest" }
    env:
      GH_TOKEN: ${{ secrets.E2E_RUNNER_TOKEN }}
      E2E_REPO: ${{ vars.E2E_REPO }}
      E2E_TAG: rd-live-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check end-to-end configuration
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$E2E_REPO" ]; then
            echo "::error::E2E_RUNNER_TOKEN secret and E2E_REPO variable must be set"
            exit 1
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5.12"
          extensions: json, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Drive every dashboard button against real runners
        run: npx playwright test -c tests/e2e-live/playwright.config.js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-e2e-${{ matrix.os }}
          path: |
            playwright-live-report/
            test-results-live/
          retention-days: 7

      - name: Remove leftover runners and runs
        if: always()
        shell: bash
        run: ./tools/ci/e2e-real-runner.sh cleanup

  e2e-live-extended:
    name: E2E · Live dashboard · ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: "Ubuntu 22.04" }
          - { os: ubuntu-22.04-arm, platform: "Ubuntu 22.04 ARM" }
          - { os: macos-15-intel, platform: "macOS 15 Intel" }
          - { os: windows-2022, platform: "Windows 2022" }
    env:
      GH_TOKEN: ${{ secrets.E2E_RUNNER_TOKEN }}
      E2E_REPO: ${{ vars.E2E_REPO }}
      E2E_TAG: rd-livex-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - name: Not requested on this pull request
        if: needs.plan.outputs.live_extended != 'true'
        run: echo "Add the ci:live-extended label to run this job on a pull request. It always runs on main and nightly."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: needs.plan.outputs.live_extended == 'true'

      - name: Check end-to-end configuration
        if: needs.plan.outputs.live_extended == 'true'
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$E2E_REPO" ]; then
            echo "::error::E2E_RUNNER_TOKEN secret and E2E_REPO variable must be set"
            exit 1
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: needs.plan.outputs.live_extended == 'true'
        with:
          php-version: "8.5.12"
          extensions: json, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.plan.outputs.live_extended == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        if: needs.plan.outputs.live_extended == 'true'
        run: npm ci

      - name: Install Chromium
        if: needs.plan.outputs.live_extended == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Drive every dashboard button against real runners
        if: needs.plan.outputs.live_extended == 'true'
        run: npx playwright test -c tests/e2e-live/playwright.config.js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && needs.plan.outputs.live_extended == 'true'
        with:
          name: live-e2e-${{ matrix.os }}
          path: |
            playwright-live-report/
            test-results-live/
          retention-days: 7

      - name: Remove leftover runners and runs
        if: always() && needs.plan.outputs.live_extended == 'true'
        shell: bash
        run: ./tools/ci/e2e-real-runner.sh cleanup

  e2e-live-fedora:
    name: E2E · Live dashboard · Fedora 44
    needs: plan
    if: needs.plan.outputs.live_extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.E2E_RUNNER_TOKEN }}
      E2E_REPO: ${{ vars.E2E_REPO }}
      E2E_TAG: rd-live-${{ github.run_id }}-${{ github.run_attempt }}-fedora
      E2E_EXTERNAL_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check end-to-end configuration
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$E2E_REPO" ]; then
            echo "::error::E2E_RUNNER_TOKEN secret and E2E_REPO variable must be set"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the dashboard inside a Fedora container
        run: |
          docker run -d --name rd-fedora --network host \
            -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e GH_TOKEN \
            -e RUNNER_ALLOW_RUNASROOT=1 \
            -e PHP_CLI_SERVER_WORKERS=4 \
            -e RUNNERDECK_SCOPE=repo \
            -e RUNNERDECK_REPO="$E2E_REPO" \
            -e RUNNERDECK_LABEL="$E2E_TAG" \
            -e RUNNERDECK_POOL_CAP=3 \
            -e RUNNERDECK_POOL_DIR=/data/pool \
            -e RUNNERDECK_SETTINGS_FILE=/data/settings.json \
            -e RUNNERDECK_HISTORY_FILE=/data/history.sqlite \
            fedora:44 bash -lc '
              set -euo pipefail
              mkdir -p /data/pool
              dnf -y --setopt=install_weak_deps=0 install --skip-unavailable \
                php-cli php-process php-xml php-mbstring php-pdo php-curl procps-ng gh tar curl git findutils which \
                libicu krb5-libs openssl-libs zlib lttng-ust
              php -v
              exec php -d max_execution_time=0 -S 127.0.0.1:8092 -t app/public
            '
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8092/health.php >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker logs rd-fedora
          exit 1

      - name: Drive every dashboard button against real runners
        run: npx playwright test -c tests/e2e-live/playwright.config.js

      - name: Container log
        if: always()
        run: docker logs rd-fedora || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-e2e-fedora
          path: |
            playwright-live-report/
            test-results-live/
          retention-days: 7

      - name: Remove leftover runners and runs
        if: always()
        run: ./tools/ci/e2e-real-runner.sh cleanup

      - name: Stop the container
        if: always()
        run: docker rm -f rd-fedora || true

  package-windows:
    name: Package · Windows zip
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false

      - name: Vet and test the launcher
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...

      - name: Build the Windows zip, the single exe and the installer
        run: python tools/package/build.py --target windows

      - name: Run the zip build and check it shuts down cleanly
        run: python tools/package/smoke_windows.py dist

      - name: Run the single exe on its own and check it shuts down cleanly
        run: python tools/package/smoke_windows.py dist --single

      - name: Install, run and uninstall the Setup wizard silently
        run: python tools/package/smoke_installer.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runnerdeck-windows-x64
          path: |
            dist/RunnerDeck-*-windows-x64-setup.exe
            dist/RunnerDeck-*-windows-x64.exe
            dist/RunnerDeck-*-windows-x64.zip
            dist/SHA256SUMS-windows-x64
          retention-days: 7

  package-linux:
    name: Package · Linux deb
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the packaging tool
        run: python3 tools/package/test_package.py

      - name: Build the Debian package and the Homebrew formula
        run: |
          git archive --format=zip --prefix="runnerdeck-ci/" -o "${RUNNER_TEMP}/source.zip" HEAD
          python3 tools/package/build.py --target linux-deb --target brew-formula \
            --source-zip "${RUNNER_TEMP}/source.zip" --tag "v$(cat VERSION)"

      - name: Check the formula is valid Ruby
        run: ruby -c dist/runnerdeck.rb

      - name: Install, run and remove the package
        run: python3 tools/package/smoke_linux.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runnerdeck-linux-all
          path: |
            dist/RunnerDeck-*-linux-all.deb
            dist/SHA256SUMS-linux-all
            dist/runnerdeck.rb
          retention-days: 7

  smoke-test:
    name: Smoke · ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: "Ubuntu latest" }
          - { os: macos-latest, platform: "macOS latest" }
          - { os: ubuntu-22.04, platform: "Ubuntu 22.04" }
          - { os: macos-15, platform: "macOS 15" }
          - { os: macos-15-intel, platform: "macOS 15 Intel" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.1"
          extensions: posix, pcntl, json, pdo_sqlite
          coverage: none

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t app/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash tools/ci/ci-smoke-status.sh

  e2e-test:
    name: E2E · Browser UI (mocked API)
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP for php -S
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php-cli php-sqlite3

      - name: Install JS dev tooling
        run: npm ci

      - name: Run E2E tests
        run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  apt-php-test:
    name: Unit · ${{ matrix.name }} · apt PHP
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04" }
          - { name: "Debian 12", image: "debian:12-slim" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git, curl, unzip, and distro PHP
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip \
            php-cli php-xml php-mbstring php-sqlite3 php-zip php-curl
          php -v
          php -r 'exit((extension_loaded("posix") && extension_loaded("pcntl")) ? 0 : 1);'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Composer and run PHPUnit
        run: bash tools/ci/ci-apt-phpunit.sh

  dnf-php-test:
    name: Unit · ${{ matrix.name }} · dnf PHP
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Fedora latest", image: "fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c" } # fedora:latest
          - { name: "Rocky Linux 9", image: "rockylinux:9" }
          - { name: "RHEL UBI 9", image: "redhat/ubi9@sha256:1963e00991088221a3405be7eb315a3dbc0be0f1f7440f0bd537d481cf33c83e" } # ubi9:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git, curl, unzip, and distro PHP
        run: |
          set -euo pipefail
          . /etc/os-release
          dnf -y --setopt=install_weak_deps=0 install --allowerasing \
            ca-certificates curl git unzip tar findutils
          if [ "${ID}" != fedora ] && [ "${VERSION_ID%%.*}" = 9 ]; then
            dnf -y module reset php || true
            dnf -y module enable php:8.2
          fi
          dnf -y --setopt=install_weak_deps=0 install \
            php-cli php-process php-xml php-mbstring php-pdo php-curl procps-ng
          dnf -y --setopt=install_weak_deps=0 install php-json || true
          dnf -y --setopt=install_weak_deps=0 install php-pecl-zip || \
            dnf -y --setopt=install_weak_deps=0 install php-zip || true
          php -v
          php -r 'exit((extension_loaded("posix") && extension_loaded("pcntl")) ? 0 : 1);'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Composer and run PHPUnit
        run: bash tools/ci/ci-apt-phpunit.sh

  alpine-smoke-test:
    name: Smoke · Alpine (musl)
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: php:8.5.12-cli-alpine@sha256:d0cc453a4a24eb5e2e70c4657cf8bddedce4c4c33a9a348409cdc7d4b9762e94
    steps:
      - name: Install git, bash, curl, and required PHP extensions
        run: |
          apk add --no-cache git bash curl tar sqlite-dev
          # shellcheck disable=SC2086
          apk add --no-cache --virtual .build-deps $PHPIZE_DEPS
          docker-php-ext-install pcntl posix pdo_sqlite
          apk del .build-deps

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh CLI (the base image has none; RunnerDeck shells out to it)
        run: sh tools/ci/install-gh.sh

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t app/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash tools/ci/ci-smoke-status.sh

  docker-smoke-test:
    name: Smoke · Docker image
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3.36"
          coverage: none

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: runnerdeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: runnerdeck:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Assert image env and runner libraries
        run: |
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' runnerdeck:ci \
            | grep -qx 'RUNNER_ALLOW_RUNASROOT=1'
          docker run --rm --entrypoint apk runnerdeck:ci info -e icu-libs krb5-libs

      - name: Run the container and hit the status endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run -d --name runnerdeck-ci \
            -p 127.0.0.1:8090:8090 \
            -e RUNNERDECK_ORG=smoke-test-org \
            -e RUNNERDECK_AUTH_TOTP_SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            runnerdeck:ci
          trap 'docker rm -f runnerdeck-ci >/dev/null 2>&1 || true' EXIT
          RUNNERDECK_SMOKE_TOTP_SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ \
            bash tools/ci/ci-smoke-status.sh
          docker logs runnerdeck-ci

  gate:
    name: CI · Merge gate
    needs: [plan, lint-php, lint-js, actionlint, shellcheck, gitleaks, coverage, test, windows-test, apt-php-test, dnf-php-test, random-order, smoke-test, alpine-smoke-test, docker-smoke-test, e2e-test, e2e-real-runner, e2e-live, e2e-live-fedora, e2e-live-extended, package-windows, package-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $failed"
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ] && ! echo "$LABELS" | jq -e 'index("ci:full") != null' >/dev/null; then
            echo "::error::Add the ci:full label to run the full CI before merging."
            exit 1
          fi
