name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: composer audit (known CVEs in dependencies)
        run: composer audit

      - name: PHP syntax check
        run: |
          find src public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: phpcs (PSR-12)
        run: composer run cs

      - name: phpstan
        run: composer run stan

  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: npm audit (known CVEs in dependencies)
        run: npm audit

      - name: eslint
        run: npm run lint:js

      - name: stylelint
        run: npm run lint:css

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflow YAML
        run: actionlint -color

  test:
    name: Unit tests (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: "8.1" }
          - { os: ubuntu-latest, php: "8.5" }
          - { os: macos-latest, php: "8.5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: composer run test

  smoke-test:
    name: Boot smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.1"
          extensions: posix, pcntl, json, pdo_sqlite
          coverage: none

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash bin/ci-smoke-status.sh

  e2e-test:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  alpine-smoke-test:
    name: Boot smoke test (Alpine/musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: php:8.5-cli-alpine@sha256:dae77e6aa4934d22b903da93e0e506c34032f5d8f8f91693d2cbf6e2724ddf73
    steps:
      - name: Install git, bash, curl, and required PHP extensions
        run: |
          apk add --no-cache git bash curl tar sqlite-dev
          # PHPIZE_DEPS is a space-separated package list from the PHP image.
          # shellcheck disable=SC2086
          apk add --no-cache --virtual .build-deps $PHPIZE_DEPS
          docker-php-ext-install pcntl posix pdo_sqlite
          apk del .build-deps

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gh CLI (the base image has none; RunnerDeck shells out to it)
        run: sh bin/install-gh.sh

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash bin/ci-smoke-status.sh

  docker-smoke-test:
    name: Boot smoke test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          coverage: none

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: runnerdeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image env and runner libraries
        run: |
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' runnerdeck:ci \
            | grep -qx 'RUNNER_ALLOW_RUNASROOT=1'
          docker run --rm --entrypoint apk runnerdeck:ci info -e icu-libs krb5-libs

      - name: Run the container and hit the status endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run -d --name runnerdeck-ci \
            -p 127.0.0.1:8090:8090 \
            -e RUNNERDECK_ORG=smoke-test-org \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            runnerdeck:ci
          trap 'docker rm -f runnerdeck-ci >/dev/null 2>&1 || true' EXIT
          bash bin/ci-smoke-status.sh
          docker logs runnerdeck-ci
