name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-static-analysis:
    name: Lint & static analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: phpcs (PSR-12)
        run: composer run cs

      - name: phpstan
        run: composer run stan

  test:
    name: Unit tests (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-13]
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, pcntl, json
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: composer run test

  smoke-test:
    name: Boot smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: posix, pcntl, json
          coverage: none

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8090/api.php?action=status" -o response.json; then
              break
            fi
            sleep 0.5
          done
          kill "$SERVER_PID" 2>/dev/null || true

          echo "--- response ---"
          cat response.json
          echo

          php -r '
            $data = json_decode(file_get_contents("response.json"), true);
            if (!is_array($data) || !array_key_exists("health", $data) || !array_key_exists("runners", $data)) {
              fwrite(STDERR, "unexpected response shape\n");
              exit(1);
            }
            echo "smoke test OK\n";
          '

  alpine-smoke-test:
    # Real coverage for the one concrete Linux-distro risk this project has:
    # run.sh and ProcessControl's shell snippets need bash, which musl-based
    # distros like Alpine don't ship by default (busybox ash/sh instead).
    name: Boot smoke test (Alpine/musl)
    runs-on: ubuntu-latest
    container:
      image: php:8.3-cli-alpine
    steps:
      - name: Install git, bash, curl, and required PHP extensions
        run: |
          apk add --no-cache git bash curl
          apk add --no-cache --virtual .build-deps $PHPIZE_DEPS
          docker-php-ext-install pcntl posix
          apk del .build-deps

      - name: Install gh CLI (the base image has none; RunnerDeck shells out to it)
        run: |
          GH_VERSION=2.100.0
          GH_SHA256=e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8090/api.php?action=status" -o response.json; then
              break
            fi
            sleep 0.5
          done
          kill "$SERVER_PID" 2>/dev/null || true

          echo "--- response ---"
          cat response.json
          echo

          php -r '
            $data = json_decode(file_get_contents("response.json"), true);
            if (!is_array($data) || !array_key_exists("health", $data) || !array_key_exists("runners", $data)) {
              fwrite(STDERR, "unexpected response shape\n");
              exit(1);
            }
            echo "smoke test OK\n";
          '
