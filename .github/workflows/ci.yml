name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.3.36"
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: composer audit (known CVEs in dependencies)
        run: composer audit

      - name: PHP syntax check
        run: |
          find src public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: phpcs (PSR-12)
        run: composer run cs

      - name: phpstan
        run: composer run stan

  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev tooling
        run: npm ci

      - name: npm audit (known CVEs in dependencies)
        run: node scripts/npm-audit.mjs

      - name: eslint
        run: npm run lint:js

      - name: stylelint
        run: npm run lint:css

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflow YAML
        run: actionlint -color

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo mv /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          shellcheck -x -S warning run.sh bin/*.sh scripts/ci/*.sh

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  test:
    name: Unit tests (${{ matrix.os }}, PHP ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Protect-main ruleset requires every CI job name. Do not rename.
          - { os: ubuntu-latest, php: "8.1", label: "8.1" }
          - { os: ubuntu-latest, php: "8.5.12", label: "8.5" }
          - { os: macos-latest, php: "8.5.12", label: "8.5" }
          # Oldest GitHub-hosted Ubuntu still offered (22.04 retires Apr 2027).
          - { os: ubuntu-22.04, php: "8.1", label: "8.1" }
          - { os: ubuntu-22.04, php: "8.3.36", label: "8.3" }
          - { os: ubuntu-22.04, php: "8.5.12", label: "8.5" }
          - { os: ubuntu-22.04-arm, php: "8.1", label: "8.1" }
          # Oldest macOS image that remains after macos-14's 2 Nov 2026 retirement.
          # macos-13 is already gone; macos-14 is in brownout.
          - { os: macos-15, php: "8.1", label: "8.1" }
          - { os: macos-15, php: "8.5.12", label: "8.5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, pcntl, json, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: composer run test

  smoke-test:
    name: Boot smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - ubuntu-22.04
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.1"
          extensions: posix, pcntl, json, pdo_sqlite
          coverage: none

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash scripts/ci/ci-smoke-status.sh

  e2e-test:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image used to generate README stills, so screenshot pixels match.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP for php -S
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php-cli php-sqlite3

      - name: Install JS dev tooling
        run: npm ci

      - name: Run E2E tests
        run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  apt-php-test:
    name: Unit tests (${{ matrix.name }}, apt PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04" }
          - { name: "Debian 12", image: "debian:12-slim" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git, curl, unzip, and distro PHP
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip \
            php-cli php-xml php-mbstring php-sqlite3 php-zip php-curl
          php -v
          php -r 'exit((extension_loaded("posix") && extension_loaded("pcntl")) ? 0 : 1);'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Composer and run PHPUnit
        run: bash scripts/ci/ci-apt-phpunit.sh

  dnf-php-test:
    name: Unit tests (${{ matrix.name }}, dnf PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Fedora", image: "fedora:latest" }
          - { name: "Rocky 9", image: "rockylinux:9" }
          - { name: "RHEL UBI 9", image: "redhat/ubi9:latest" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git, curl, unzip, and distro PHP
        run: |
          set -euo pipefail
          . /etc/os-release
          # EL9 ships curl-minimal, which conflicts with curl unless erased.
          # dnf5 (Fedora 44+) requires --allowerasing after `install`.
          dnf -y --setopt=install_weak_deps=0 install --allowerasing \
            ca-certificates curl git unzip tar findutils
          # EL9 AppStream default PHP is 8.0; enable 8.2 (posix/pcntl in php-process).
          if [ "${ID}" != fedora ] && [ "${VERSION_ID%%.*}" = 9 ]; then
            dnf -y module reset php || true
            dnf -y module enable php:8.2
          fi
          dnf -y --setopt=install_weak_deps=0 install \
            php-cli php-process php-xml php-mbstring php-pdo php-curl procps-ng
          dnf -y --setopt=install_weak_deps=0 install php-json || true
          dnf -y --setopt=install_weak_deps=0 install php-pecl-zip || \
            dnf -y --setopt=install_weak_deps=0 install php-zip || true
          php -v
          php -r 'exit((extension_loaded("posix") && extension_loaded("pcntl")) ? 0 : 1);'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Composer and run PHPUnit
        run: bash scripts/ci/ci-apt-phpunit.sh

  alpine-smoke-test:
    name: Boot smoke test (Alpine/musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: php:8.5.12-cli-alpine@sha256:d0cc453a4a24eb5e2e70c4657cf8bddedce4c4c33a9a348409cdc7d4b9762e94
    steps:
      - name: Install git, bash, curl, and required PHP extensions
        run: |
          apk add --no-cache git bash curl tar sqlite-dev
          # PHPIZE_DEPS is a space-separated package list from the PHP image.
          # shellcheck disable=SC2086
          apk add --no-cache --virtual .build-deps $PHPIZE_DEPS
          docker-php-ext-install pcntl posix pdo_sqlite
          apk del .build-deps

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gh CLI (the base image has none; RunnerDeck shells out to it)
        run: sh scripts/ci/install-gh.sh

      - name: Boot the dashboard and hit the status endpoint
        env:
          RUNNERDECK_ORG: smoke-test-org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php -S 127.0.0.1:8090 -t public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash scripts/ci/ci-smoke-status.sh

  docker-smoke-test:
    name: Boot smoke test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.3.36"
          coverage: none

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: runnerdeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image env and runner libraries
        run: |
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' runnerdeck:ci \
            | grep -qx 'RUNNER_ALLOW_RUNASROOT=1'
          docker run --rm --entrypoint apk runnerdeck:ci info -e icu-libs krb5-libs

      - name: Run the container and hit the status endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run -d --name runnerdeck-ci \
            -p 127.0.0.1:8090:8090 \
            -e RUNNERDECK_ORG=smoke-test-org \
            -e RUNNERDECK_AUTH_TOTP_SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            runnerdeck:ci
          trap 'docker rm -f runnerdeck-ci >/dev/null 2>&1 || true' EXIT
          RUNNERDECK_SMOKE_TOTP_SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ \
            bash scripts/ci/ci-smoke-status.sh
          docker logs runnerdeck-ci
