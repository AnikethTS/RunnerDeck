name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="$(mktemp -d)/runnerdeck-${VERSION}"
          mkdir -p "$STAGE_DIR"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='runners' \
            --exclude='*.log' \
            ./ "$STAGE_DIR/"
          (cd "$(dirname "$STAGE_DIR")" && zip -qr "${GITHUB_WORKSPACE}/runnerdeck-${VERSION}.zip" "$(basename "$STAGE_DIR")")

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "runnerdeck-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
