name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="$(mktemp -d)/runnerdeck-${VERSION}"
          mkdir -p "$STAGE_DIR"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='runners' \
            --exclude='*.log' \
            ./ "$STAGE_DIR/"
          (cd "$(dirname "$STAGE_DIR")" && zip -qr "${GITHUB_WORKSPACE}/runnerdeck-${VERSION}.zip" "$(basename "$STAGE_DIR")")

      - name: Checksum the archive
        run: sha256sum "runnerdeck-${GITHUB_REF_NAME}.zip" > "runnerdeck-${GITHUB_REF_NAME}.zip.sha256"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "runnerdeck-${{ github.ref_name }}.zip"

      - name: Attach the attestation bundle as a release asset
        run: cp "${{ steps.attest.outputs.bundle-path }}" "runnerdeck-${GITHUB_REF_NAME}.zip.sigstore.json"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "runnerdeck-${GITHUB_REF_NAME}.zip" \
            "runnerdeck-${GITHUB_REF_NAME}.zip.sha256" \
            "runnerdeck-${GITHUB_REF_NAME}.zip.sigstore.json" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Verify: \`sha256sum -c runnerdeck-${GITHUB_REF_NAME}.zip.sha256\`. Verify build provenance: \`gh attestation verify runnerdeck-${GITHUB_REF_NAME}.zip -o AnikethTS\` (or via the attached .sigstore.json bundle). Container: \`docker pull ghcr.io/anikethts/runnerdeck:${GITHUB_REF_NAME}\`."

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/anikethts/runnerdeck:${{ github.ref_name }}
            ghcr.io/anikethts/runnerdeck:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the published GHCR image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/anikethts/runnerdeck:${{ github.ref_name }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  windows-package:
    name: Build and publish the Windows installer
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false

      - name: Build the Windows installer
        run: python tools/package/build.py --target windows-setup

      - name: Install, run and uninstall the Setup wizard silently
        run: python tools/package/smoke_installer.py dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/RunnerDeck-*-windows-x64-setup.exe

      - name: Attach the installer, its checksum and the attestation to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle="dist/RunnerDeck-windows-x64.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "${bundle}"
          gh release upload "${GITHUB_REF_NAME}" \
            dist/RunnerDeck-*-windows-x64-setup.exe \
            dist/SHA256SUMS-windows-x64 \
            "${bundle}" --clobber

  linux-package:
    name: Build and publish the Debian package and Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the release source archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern "runnerdeck-${GITHUB_REF_NAME}.zip" --dir "${RUNNER_TEMP}"

      - name: Build the Debian package and the Homebrew formula
        run: |
          python3 tools/package/test_package.py
          python3 tools/package/build.py --target linux-deb --target brew-formula \
            --source-zip "${RUNNER_TEMP}/runnerdeck-${GITHUB_REF_NAME}.zip" --tag "${GITHUB_REF_NAME}"

      - name: Check the formula is valid Ruby
        run: ruby -c dist/runnerdeck.rb

      - name: Install, run and remove the package
        run: python3 tools/package/smoke_linux.py dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/RunnerDeck-*-linux-all.deb
            dist/runnerdeck.rb

      - name: Attach the package, the formula and their checksums to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle="dist/RunnerDeck-linux-all.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "${bundle}"
          gh release upload "${GITHUB_REF_NAME}" \
            dist/RunnerDeck-*-linux-all.deb \
            dist/SHA256SUMS-linux-all \
            dist/runnerdeck.rb \
            "${bundle}" --clobber

  homebrew-tap:
    name: Update the Homebrew tap
    needs: linux-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when no tap token is configured
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap was not updated. Copy runnerdeck.rb from the release into the tap by hand."

      - name: Download the formula from the release
        if: env.TAP_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern runnerdeck.rb --dir "${RUNNER_TEMP}"

      - name: Publish the formula to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/AnikethTS/homebrew-runnerdeck.git" "${RUNNER_TEMP}/tap"
          cd "${RUNNER_TEMP}/tap"
          mkdir -p Formula
          cp "${RUNNER_TEMP}/runnerdeck.rb" Formula/runnerdeck.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/runnerdeck.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git commit -m "runnerdeck ${GITHUB_REF_NAME}"
          git push origin HEAD:main
