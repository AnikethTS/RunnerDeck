name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="$(mktemp -d)/runnerdeck-${VERSION}"
          mkdir -p "$STAGE_DIR"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='runners' \
            --exclude='*.log' \
            ./ "$STAGE_DIR/"
          (cd "$(dirname "$STAGE_DIR")" && zip -qr "${GITHUB_WORKSPACE}/runnerdeck-${VERSION}.zip" "$(basename "$STAGE_DIR")")

      - name: Checksum the archive
        run: sha256sum "runnerdeck-${GITHUB_REF_NAME}.zip" > "runnerdeck-${GITHUB_REF_NAME}.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "runnerdeck-${{ github.ref_name }}.zip"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "runnerdeck-${GITHUB_REF_NAME}.zip" \
            "runnerdeck-${GITHUB_REF_NAME}.zip.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Verify: \`sha256sum -c runnerdeck-${GITHUB_REF_NAME}.zip.sha256\`. Build provenance attestation: \`gh attestation verify runnerdeck-${GITHUB_REF_NAME}.zip -o AnikethTS\`."
