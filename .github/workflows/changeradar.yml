# ChangeRadar 0.2.5 consumer workflow. Do not clone ChangeRadar or run its Gradle.
#
# Two version knobs:
# 1. uses: …@<sha> — Action wrapper (Java, download, report). Pin a SHA.
#    Dependabot moves this SHA when ChangeRadar publishes a tag. Do not
#    hand-edit it. An analyzer-only release still needs no workflow edit:
#    the JAR input below is what carries scan behavior.
# 2. version: — analyzer JAR. Omit (or latest) for GitHub's latest release.
#    Set version: v0.2.5 to pin a JAR.
#
# Artifact, sticky PR comment, and Checks notices are posted by the Action.
# Fork PRs skip comment and annotations. The annotations job below still
# reports the required check name, because a fork token cannot create it.
# Fail-open (no --policy).
name: ChangeRadar

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: AnikethTS/ChangeRadar@414c23d99a59e59dad7a1d069e1bf2e8004adac9 # v0.2.7
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # version: v0.2.5

  annotations:
    name: ChangeRadar annotations
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fork pull requests do not receive file annotations
        run: echo "ChangeRadar wrote the impact report. File annotations are posted on a same-repository pull request."
