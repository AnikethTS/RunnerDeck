# ChangeRadar 0.2.6 consumer workflow. Do not clone ChangeRadar or run its Gradle.
#
# Two version knobs:
# 1. uses: …@<sha> — Action wrapper (Java, download, report). Pin a SHA.
# 2. version: — analyzer JAR. Omit (or latest) for GitHub's latest release.
#    Set version: v0.2.6 to pin a JAR.
#
# Artifact, sticky PR comment, and Checks notices are posted by the Action.
# Fork PRs skip comment and annotations. Fail-open (no --policy).
name: ChangeRadar

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: AnikethTS/ChangeRadar@e3d3b3488ab7f20c347fd41dbba9386552082bd5 # v0.2.6
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # version: v0.2.6
