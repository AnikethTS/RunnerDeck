name: Socket Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-report:
    name: Security · Socket project report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Socket CLI
        run: pip install --require-hashes -r tools/ci/socket-requirements.txt

      - name: Project report
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo "::notice title=Socket Security::Add a free Socket API token as the SOCKET_SECURITY_API_KEY repository secret to generate the project report."
            exit 0
          fi
          args=(
            --target-path "$GITHUB_WORKSPACE"
            --scm github
          )
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(--pr-number "$PR_NUMBER")
          fi
          socketcli "${args[@]}"
