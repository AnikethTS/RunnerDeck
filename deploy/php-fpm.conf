; php-fpm for RunnerDeck. Run as the same account that owns `gh` auth and
; the runner pool — not www-data. Live logs (log_stream.php) hold a worker
; for up to 30 minutes; this pool is sized for one operator, not a farm.
;
; systemd user unit: deploy/runnerdeck-php-fpm.service
;   php-fpm --nodaemonize --fpm-config /path/to/deploy/php-fpm.conf
;
; Distro-wide php-fpm: copy the [runnerdeck] section into a pool.d snippet,
; add user=/group= for the operator, drop [global] (the distro master owns
; that), and point nginx/Caddy at listen.

[global]
error_log = /proc/self/fd/2
daemonize = no

[runnerdeck]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
pm = ondemand
pm.max_children = 16
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 2100
php_admin_value[max_execution_time] = 2100
php_admin_value[output_buffering] = 0
catch_workers_output = yes
clear_env = no
security.limit_extensions = .php
env[PATH] = /usr/local/bin:/usr/bin:/bin
