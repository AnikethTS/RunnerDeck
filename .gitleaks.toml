# Allow documented placeholders and unit-test fixtures. Real PEMs and tokens
# still fail the scan anywhere else.
title = "RunnerDeck"

[allowlist]
description = "Test fixtures and UI placeholders, not live credentials"
paths = [
    '''app/tests/GithubAppTest\.php''',
    '''app/tests/AppLogTest\.php''',
    '''app/public/settings\.php''',
]
